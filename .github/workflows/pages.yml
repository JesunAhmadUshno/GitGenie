name: Pages

# Publishes both sites to GitHub Pages in one artifact: the Next.js app (static export) at
# /GitGenie/ and the live dashboard in site/ at /GitGenie/lab/. This is the only workflow that
# deploys Pages (deploy-pages.yml only checks the app). The dashboard reads lib/, app/, server/
# and git history, so every push to main rebuilds.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # extract-history.mjs reads the full git log and commit 97f0670
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            site/package-lock.json
      - name: Build the Next.js app (static export to out/)
        run: npm install --legacy-peer-deps && npm run build
      - run: npm ci
        working-directory: site
      - run: npm run build
        working-directory: site
      - name: Assemble app at / and dashboard at /lab/
        run: |
          mkdir -p out/lab
          cp -r site/dist/. out/lab/
          test -f out/index.html && test -f out/lab/index.html
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: out
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4

name: Next.js build check

# Formerly deployed the Next.js export to Pages. That export loaded every asset from
# /gitgenie/ while Pages serves /GitGenie/, so the live page rendered unstyled. Pages is
# now published by pages.yml (the site/ dashboard); this workflow only checks that the
# Next.js app still builds and that the engine tests pass. It no longer deploys, so the
# two workflows cannot overwrite each other.
on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm install --legacy-peer-deps

      - name: Engine tests
        run: npm test

      - name: Build
        run: npm run build
